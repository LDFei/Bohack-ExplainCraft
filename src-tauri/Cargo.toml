[package]
name = "lingjing-desktop"
version = "0.1.0"
description = "灵镜 · AI 视频创作空间桌面应用：Tauri 窗口 + 进程内嵌入的 Rust 后端。"
edition = "2021"
publish = false

# 按 Tauri 约定，逻辑写在 lib.rs，main.rs 只调用 run()。桌面端只需要 rlib。
[lib]
name = "lingjing_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# quercus 现在始终编译；保留同名空 feature，兼容仍传 `--features quercus` 的脚本和文档。
quercus = []

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
png = { version = "0.17"}
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
resvg = "0.45"
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tiny-skia = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
uuid = { version = "1", features = ["v4"] }
usvg = "0.45"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quercus-engine-rs = { version = "0.7" }
rmcp = { version = "3.8", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
