<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta
      name="description"
      content="下载 ExplainCraft 桌面应用：把知识点做成看得懂、愿意看完的视频。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ExplainCraft · 把知识讲成视频</title>
    <script>
      // 首屏前先应用已保存的主题，避免默认主题切换时的颜色闪动。
      try {
        const saved = localStorage.getItem("explaincraft.ui-theme");
        const allowed = ["glass", "silver", "lilac", "paper", "mist", "forest"];
        document.documentElement.dataset.theme =
          saved && allowed.includes(saved) ? saved : "glass";
      } catch {
        document.documentElement.dataset.theme = "glass";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/cover/main.ts"></script>
  </body>
</html>
