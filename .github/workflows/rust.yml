name: Rust workspace

on:
  push:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo format and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      FFMPEG_DIR: "/usr"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Build desktop frontend for Tauri codegen
        run: |
          npm --prefix front ci
          npm --prefix front run build:studio
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libmpg123-dev libzstd-dev ffmpeg
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Cargo workspace
        run: cargo test --workspace
