name: Frontend code quality

on:
  push:
    branches: [main, develop]
    # 前端变更才运行；队友仅改后端时不要求执行这套 Node/Python 检查。
    paths:
      - 'front/**'
      - '.github/workflows/check.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'front/**'
      - '.github/workflows/check.yml'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend format, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # defaults 只影响 run 命令，下面两个 action 的缓存路径仍要显式写 front/。
        working-directory: front
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.25'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: front/uv.lock
      - name: Install frontend tools
        run: npm ci
      - name: Check formatting
        # 检查失败就停止，不在远端悄悄改文件，避免本机与仓库代码不一致。
        run: npm run format:check
      - name: Run logic tests
        run: npm test
      - name: Build frontend
        run: npm run build
