name: Desktop release
on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - 'src-tauri/**'
      - 'shared/public/media/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.*'
      - '.github/workflows/release-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HUSKY: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: desktop-${{ matrix.platform }}
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/explaincraft-ffmpeg-8
          key: linux-ffmpeg-8.0.1-x264-v2
      - name: Install Linux libraries and FFmpeg 8 SDK
        if: runner.os == 'Linux'
        run: bash src-tauri/scripts/setup-linux-ci.sh
      - name: Install macOS build libraries and tools
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg mpg123 zstd dylibbundler
          echo "FFMPEG_DIR=$(brew --prefix)" >> "$GITHUB_ENV"
          mkdir -p src-tauri/runtime
          cp "$(command -v ffmpeg)" "$(command -v ffprobe)" src-tauri/runtime/
      - name: Install Windows FFmpeg SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest
          $asset = $release.assets | Where-Object name -Match '^ffmpeg-n8\.1-.*win64-gpl-shared-8\.1\.zip$' | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object name -Match '^ffmpeg-n8\.1-.*win64-gpl-shared.*\.zip$' | Select-Object -First 1 }
          if (-not $asset) { throw 'FFmpeg 8.1 shared SDK not available' }
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ffmpeg-sdk"
          $sdk = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg-sdk" -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$sdk" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "CC=cl" >> $env:GITHUB_ENV
          "CXX=cl" >> $env:GITHUB_ENV
          "$sdk/bin" >> $env:GITHUB_PATH
          New-Item src-tauri/runtime -ItemType Directory -Force | Out-Null
          Copy-Item "$sdk/bin/*" src-tauri/runtime/
          @{ bundle = @{ resources = @{ 'runtime/' = './' }; windows = @{ nsis = @{ installMode = 'currentUser' } } } } | ConvertTo-Json -Depth 8 | Set-Content src-tauri/tauri.release.json
      - name: Configure Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          echo '{"bundle":{"linux":{"deb":{"depends":["ffmpeg","libmpg123-0t64","libzstd1","fonts-noto-cjk","libasound2t64","libjack-jackd2-0","libpipewire-0.3-0t64","libx264-164"]}}}}' > src-tauri/tauri.release.json
      - name: Install frontend
        working-directory: front
        run: npm ci
      - name: Verify release metadata and frontend
        working-directory: front
        run: |
          node scripts/desktop-release.mjs metadata
          node --test scripts/desktop-release.test.mjs
          npm test
          npm run build
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Cargo workspace on native platform
        run: cargo test --workspace --locked
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: front
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.json -- --locked
      - name: Build Linux installer
        if: runner.os == 'Linux'
        working-directory: front
        run: npm run tauri -- build --bundles deb --config src-tauri/tauri.release.json -- --locked
      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: front
        run: npm run tauri -- build --bundles app -- --locked
      - name: Make self-contained macOS disk image
        if: runner.os == 'macOS'
        run: bash src-tauri/scripts/package-macos.sh
      - name: Install and verify native package
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        working-directory: front
        run: node scripts/desktop-release.mjs verify-package
      - name: Collect installers and licenses
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        working-directory: front
        run: node scripts/desktop-release.mjs collect
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error
