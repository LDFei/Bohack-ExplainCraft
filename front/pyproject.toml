[project]
name = "bohack-dev-tools"
version = "0.1.0"
description = "Formatting tools for the project's Python helper scripts."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["node_modules", "dist", "test-results", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
